name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure persistent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release signing secrets are incomplete; building with the temporary CI debug key."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/livetv-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Prepare Release Asset
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/LiveTv-${{ steps.tag_info.outputs.tag }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: LiveTV ${{ steps.tag_info.outputs.tag }}
          files: release-artifacts/*.apk
          body: |
            ### LiveTV for Android TV / Google TV (${{ steps.tag_info.outputs.tag }})

            Download the pre-compiled APK below to install on your Android TV or Google TV device.

            #### Features and improvements:
            - Live UK listings for BBC, ITV, Channel 4 and Channel 5, plus HDHomeRun tuner channels.
            - Local UDP tuner discovery with automatic address detection, hostname/cloud fallbacks, and rediscovery on startup.
            - Reliable D-pad navigation from every broadcaster filter into the guide, including channels with no listings.
            - Programme details and artwork without duplicate play controls; select a live programme in the guide to watch.
            - Direct deep links into broadcaster apps and built-in LibVLC tuner playback, including MPEG-2 video.
            - Choose the built-in tuner player or an installed external player in Settings.
            - The weak-signal hide action receives focus automatically and supports remote OK and gamepad A. Restore hidden channels in Settings.
            - Cleaner settings, updated launcher icons and TV banner, and refreshed screenshots showing live programmes and artwork.
            - Provider, channel-number and alphabetical ordering; new installs default to provider order.

            See the [README](https://github.com/andrewpmoore/LiveTv/tree/${{ steps.tag_info.outputs.tag }}#readme) for screenshots, installation, tuner setup and signing instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
